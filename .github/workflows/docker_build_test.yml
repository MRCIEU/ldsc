name: docker build+test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Docker build
      run: docker build -t mrcieu/ldsc .
    - name: Docker run
      run: |
        docker run mrcieu/ldsc ldsc.py -h
        docker run mrcieu/ldsc munge_sumstats.py -h
